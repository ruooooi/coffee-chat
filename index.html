<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coffee with Ruirui</title>
<meta name="description" content="Book a coffee chat with Ruirui Wu, Business Admin & Econ at De Anza College.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=Jost:wght@400;500;600&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ecd6da'/%3E%3Cpath d='M8 12h14l-2 11a3 3 0 0 1-3 2h-4a3 3 0 0 1-3-2z' fill='%232e1a14'/%3E%3Cpath d='M22 14h2a3 3 0 0 1 0 6h-2' fill='none' stroke='%232e1a14' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme:light;
  --dots:#ecd6da; --dot:#2e1a14; --card:#fffaf7; --ink:#2e1a14; --muted:#5b4640; --line:#e2c3c9;
  --soft:#f6ecee; --pink:#e8a3b6; --rose:#b04a6a; --off:#9a8287; --danger:#a3324f;
  --f-display:"Bodoni Moda", "Didot", Georgia, serif;
  --f-body:"Jost", "Futura", system-ui, sans-serif;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background-color:var(--dots);background-image:radial-gradient(var(--dot) 2.6px,transparent 2.9px);background-size:24px 24px;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 48px}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border-radius:28px;padding:24px 22px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.2em;font-weight:600;color:var(--rose)}
h1{margin:0;font-family:var(--f-display);font-weight:500;font-size:clamp(36px,9vw,46px);line-height:1;text-wrap:balance}
h1 em{font-style:italic}
h2{margin:0;font-family:var(--f-display);font-weight:500;font-style:italic;font-size:22px}
.intro{margin:0;font-size:15px;color:var(--muted);max-width:52ch}
.contacts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cbtn{display:flex;flex-direction:column;align-items:center;gap:5px;text-decoration:none;color:var(--ink);font:inherit;font-size:12px;background:transparent;border:0;padding:0;cursor:pointer;min-width:0;text-align:center}
.cbtn .ic{width:50px;height:50px;border-radius:50%;background:var(--soft);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;transition:transform .15s}
.cbtn:hover .ic{transform:translateY(-2px)}
.cbtn.locked{color:var(--off);cursor:default}
.cbtn.locked .ic{background:var(--card);border-style:dashed}
.cbtn:focus-visible .ic,button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.cinfo{font-size:14px;color:var(--muted);text-align:center;min-height:1.3em;overflow-wrap:anywhere}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:8px}
.day{min-height:62px;border:1.5px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);font:inherit;line-height:1.1;cursor:pointer}
.day .d{font-family:var(--f-display);font-size:22px}
.day .w{font-size:12px}
.day.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{min-height:40px;padding:0 14px;border-radius:999px;border:0;background:var(--soft);color:var(--ink);font:inherit;font-size:14px;cursor:pointer;display:inline-flex;align-items:center}
.pill.on{background:var(--ink);color:var(--card)}
.pill:disabled{opacity:.45;cursor:default}
.times{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.time{min-height:46px;border:1.5px solid var(--ink);border-radius:999px;background:var(--card);color:var(--ink);font:inherit;font-variant-numeric:tabular-nums;cursor:pointer}
.time.on{background:var(--pink);border-color:var(--pink);font-weight:600}
.where{font-size:13px;color:var(--muted);text-align:center}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;min-width:0}
input,textarea{font:inherit;font-size:16px;font-weight:400;color:var(--ink);background:var(--soft);border:1.5px solid transparent;border-radius:14px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
.cta{min-height:56px;border:0;border-radius:999px;background:var(--ink);color:var(--card);font-family:var(--f-display);font-style:italic;font-size:19px;cursor:pointer;padding:0 20px}
.cta:disabled{opacity:.5;cursor:default}
.ghost{min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.danger{color:var(--danger)}
.status{font-size:14px;color:var(--muted);min-height:1.2em;text-align:center}
.note{font-size:14px;color:var(--muted);margin:0}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.done{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.check{width:64px;height:64px;border-radius:50%;background:var(--pink);display:flex;align-items:center;justify-content:center}
.ticket{display:flex;flex-direction:column;align-self:stretch;text-align:left}
.ticket .tr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1.5px dashed var(--line);font-size:15px;flex-wrap:wrap}
.ticket .tr span:first-child{color:var(--muted)}
.ticket .tr b{font-weight:600;text-align:right}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-self:stretch}
.two a,.two button{min-height:48px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-size:15px;cursor:pointer}
.brew{display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 0 48px;text-align:center}
.brew .liq{transform-box:fill-box;transform-origin:bottom;animation:fill 1.5s cubic-bezier(.5,0,.3,1) forwards}
.brew .steam path{opacity:0;animation:steam 1.3s ease-in-out infinite}
.brew .steam path:nth-child(2){animation-delay:.25s}.brew .steam path:nth-child(3){animation-delay:.5s}
.brew .cup{animation:wobble 1.5s ease-in-out infinite}
@keyframes fill{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:.85}100%{opacity:0;transform:translateY(-12px)}}
@keyframes wobble{0%,100%{transform:rotate(0)}50%{transform:rotate(-2deg)}}
.ckwrap{position:relative;width:64px;height:64px}
.confetti i{position:absolute;left:28px;top:28px;width:8px;height:8px;border-radius:50%;background:var(--dot);opacity:0}
.confetti i:nth-child(even){background:var(--rose)}
.done.enter>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.done.enter>*:nth-child(2){animation-delay:.12s}.done.enter>*:nth-child(3){animation-delay:.2s}.done.enter>*:nth-child(4){animation-delay:.28s}
.done.enter>*:nth-child(5){animation-delay:.38s}.done.enter>*:nth-child(6){animation-delay:.46s}.done.enter>*:nth-child(n+7){animation-delay:.54s}
.done.enter .check{animation:pop .55s cubic-bezier(.3,1.7,.5,1) both}
.done.enter .check path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .4s .35s ease-out forwards}
.done.enter .confetti i{animation:burst .8s .3s ease-out forwards}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(.2)}to{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes burst{0%{opacity:1;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1)}}
@media (prefers-reduced-motion:reduce){.brew *,.done.enter *,.done.enter,.cbtn .ic{animation:none!important;transition:none!important}.done.enter .check path{stroke-dashoffset:0}}
footer{text-align:center;font-size:12px;color:var(--ink);background:var(--card);border-radius:999px;padding:6px 14px;align-self:center}
</style>
</head>
<body>
<main class="wrap">
  <section class="card">
    <div class="eyebrow">COFFEE CHAT</div>
    <h1>Coffee with <em>Ruirui</em></h1>
    <p class="intro">Hi, I'm Ruirui! I'm a second-year Business Admin &amp; Econ major at De Anza, hoping to transfer in 2027. Let's grab a coffee or boba and chat! :)</p>
    <div class="contacts">
      <a class="cbtn" href="https://www.linkedin.com/in/ruirui-wu-92804638b/" target="_blank" rel="noopener" aria-label="LinkedIn profile">
        <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/><path d="M3 13h18"/></svg></span>LinkedIn</a>
      <a class="cbtn" href="https://www.instagram.com/re_wuuuu/" target="_blank" rel="noopener" aria-label="Instagram @re_wuuuu">
        <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.9" fill="currentColor"/></svg></span>Instagram</a>
      <a class="cbtn" id="emailBtn" href="mailto:ruiruiwu077@gmail.com" aria-label="Email ruiruiwu077@gmail.com">
        <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span>Email</a>
      <button class="cbtn locked" type="button" id="phoneBtn" aria-label="Phone number, shown after you book">
        <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></span><span id="phoneLbl">After booking</span></button>
    </div>
    <div class="cinfo" id="cinfo">ruiruiwu077@gmail.com</div>
  </section>

  <section class="card" id="bookCard">
    <div class="status" id="loadStatus">Loading open times…</div>
    <div id="bookArea"></div>
  </section>

  <section class="card" id="mineCard" hidden>
    <h2>Your coffee chats</h2>
    <div id="mineList"></div>
  </section>
  <footer>All times Pacific</footer>
</main>

<script src="config.js"></script>
<script>
(function(){
  const API = (window.COFFEE_API || "").trim();
  const LENS = [15, 30, 45, 60];
  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  let windows = [], sel = { date: null, len: 30, start: null, mode: "In person" };
  let brewing = false, bookMsg = "", enterAnim = false, justBooked = null, draft = null;
  let mine = loadMine();

  const pad = n => String(n).padStart(2, "0");
  const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
  const hhmm = m => pad(Math.floor(m / 60)) + ":" + pad(m % 60);
  const fmtT = m => { const h = Math.floor(m / 60), mm = m % 60, ap = h >= 12 ? "pm" : "am"; return ((h + 11) % 12 + 1) + (mm ? ":" + pad(mm) : "") + ap; };
  const dObj = d => { const [y, mo, dd] = d.split("-").map(Number); return new Date(y, mo - 1, dd); };
  const shortDate = d => dObj(d).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
  function nowPT(){
    const p = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Los_Angeles", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(new Date());
    const g = t => p.find(x => x.type === t).value;
    return { date: g("year") + "-" + g("month") + "-" + g("day"), min: Number(g("hour")) * 60 + Number(g("minute")) };
  }
  function lsGet(k){ try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
  function lsSet(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }
  function loadMine(){ try { return JSON.parse(localStorage.getItem("cc_mine") || "[]"); } catch (e) { return []; } }
  function saveMine(){ lsSet("cc_mine", JSON.stringify(mine)); }
  const upcomingMine = () => { const n = nowPT(); return mine.filter(m => m.date > n.date || (m.date === n.date && m.start + m.mins > n.min)); };
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const BREW_MS = (() => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches ? 500 : 1700; } catch (e) { return 1700; } })();

  function floorMin(w){ const n = nowPT(), s = toMin(w.start); if (w.date > n.date) return s; if (w.date < n.date) return Infinity; return Math.max(s, Math.ceil((n.min + 15) / 15) * 15); }
  function freeStarts(w, len){
    const end = toMin(w.end), out = [];
    for (let s = floorMin(w); s + len <= end; s += 15) if (!w.booked.some(([a, m]) => s < a + m && s + len > a)) out.push(s);
    return out;
  }
  const dayOptions = (date, len) => windows.filter(w => w.date === date).flatMap(w => freeStarts(w, len).map(s => ({ s, w })));

  async function copy(text, label){
    try { await navigator.clipboard.writeText(text); $("cinfo").textContent = label + " copied: " + text; }
    catch (e) { $("cinfo").textContent = text; }
  }
  $("emailBtn").addEventListener("click", () => { copy("ruiruiwu077@gmail.com", "Email"); });
  function phone(){ const m = upcomingMine().find(x => x.phone); return m ? m.phone : ""; }
  $("phoneBtn").addEventListener("click", () => { if (phone()) copy(phone(), "Phone"); else $("cinfo").textContent = "Book a time and my number shows up here."; });
  function renderPhone(){
    const p = phone(), b = $("phoneBtn");
    b.classList.toggle("locked", !p); $("phoneLbl").textContent = p || "After booking";
    b.setAttribute("aria-label", p ? "Copy phone number " + p : "Phone number, shown after you book");
  }

  function render(){ renderBook(); renderMine(); renderPhone(); }

  function brewView(){
    const bw = el("div", "brew"); bw.setAttribute("role", "status");
    bw.innerHTML = '<svg class="cup" width="120" height="120" viewBox="0 0 120 120" aria-hidden="true">'
      + '<g class="steam" fill="none" stroke="#b04a6a" stroke-width="3" stroke-linecap="round"><path d="M44 30c-5-6 5-10 0-16"/><path d="M58 30c-5-6 5-10 0-16"/><path d="M72 30c-5-6 5-10 0-16"/></g>'
      + '<clipPath id="cupClip"><path d="M28 40h64l-7 56a10 10 0 0 1-10 9H45a10 10 0 0 1-10-9z"/></clipPath>'
      + '<rect class="liq" x="20" y="48" width="80" height="60" fill="#8a5a44" clip-path="url(#cupClip)"/>'
      + '<path d="M28 40h64l-7 56a10 10 0 0 1-10 9H45a10 10 0 0 1-10-9z" fill="none" stroke="#2e1a14" stroke-width="3.5" stroke-linejoin="round"/>'
      + '<path d="M90 52h6a10 10 0 0 1 0 20h-9" fill="none" stroke="#2e1a14" stroke-width="3.5" stroke-linecap="round"/>'
      + '<ellipse cx="60" cy="110" rx="38" ry="4" fill="#e8a3b6"/></svg>';
    bw.append(el("h2", null, "Brewing your coffee chat…"), el("p", "note", "Saving your spot with Ruirui"));
    return bw;
  }

  function confirmation(m){
    const box = el("div", "done" + (enterAnim ? " enter" : "")); enterAnim = false;
    const ckw = el("div", "ckwrap"), conf = el("div", "confetti"); conf.setAttribute("aria-hidden", "true");
    [[0,-58],[42,-40],[58,0],[40,42],[0,58],[-42,40],[-58,0],[-40,-42]].forEach(([dx, dy]) => { const i = el("i"); i.style.setProperty("--dx", dx + "px"); i.style.setProperty("--dy", dy + "px"); conf.append(i); });
    const ck = el("div", "check");
    ck.innerHTML = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2e1a14" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>';
    ckw.append(conf, ck);
    const h = el("h1"); h.append("See you ", el("em", null, "soon!"));
    box.append(ckw, el("div", "eyebrow", "YOU'RE BOOKED"), h,
      el("p", "intro", m.mode === "Online" ? "Thanks for booking a coffee chat! I'll send you a video link before we meet." : "Thanks for booking a coffee chat! I'll text you to pick the exact spot."));
    const t = el("div", "ticket");
    const head = el("div"); head.style.cssText = "display:flex;justify-content:space-between;align-items:baseline;padding-bottom:12px;gap:10px;flex-wrap:wrap";
    head.append(el("h2", null, dObj(m.date).toLocaleDateString("en-US", { weekday: "long", month: "short", day: "numeric" })), el("span", "pill", m.mins + " min"));
    t.append(head);
    const row = (k, v) => { const r = el("div", "tr"); r.append(el("span", null, k)); if (typeof v === "string") r.append(el("b", null, v)); else r.append(v); t.append(r); };
    row("Time", fmtT(m.start) + " – " + fmtT(m.start + m.mins));
    row("Where", m.mode === "Online" ? "Online · video call" : "In person · De Anza or a café");
    const pa = el("a", "ghost", m.phone); pa.href = "tel:" + m.phone.replace(/[^\d+]/g, ""); pa.style.cssText = "display:inline-flex;align-items:center;text-decoration:none";
    row("Ruirui's phone", pa);
    box.append(t);
    const two = el("div", "two");
    const li = el("a", null, "LinkedIn"); li.href = "https://www.linkedin.com/in/ruirui-wu-92804638b/"; li.target = "_blank"; li.rel = "noopener";
    const ig = el("a", null, "@re_wuuuu"); ig.href = "https://www.instagram.com/re_wuuuu/"; ig.target = "_blank"; ig.rel = "noopener";
    two.append(li, ig); box.append(two);
    const st = el("div", "status");
    const cal = el("button", "cta", "Add to my calendar"); cal.type = "button"; cal.style.alignSelf = "stretch";
    cal.onclick = () => { saveIcs(m); st.textContent = "Calendar file downloaded. Open it to add the chat."; };
    const two2 = el("div", "two");
    const back = el("button", null, "Back to times"); back.type = "button"; back.onclick = () => { justBooked = null; render(); };
    const cn = el("button", "danger", "Cancel booking"); cn.type = "button"; let armed = false;
    cn.onclick = async () => { if (!armed){ armed = true; cn.textContent = "Tap again to cancel"; return; } await cancel(m, st); };
    two2.append(back, cn);
    box.append(cal, st, two2);
    return box;
  }

  function saveIcs(m){
    const d = m.date.replace(/-/g, ""), t = x => pad(Math.floor(x / 60)) + pad(x % 60) + "00";
    const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Coffee with Ruirui//EN","BEGIN:VEVENT",
      "UID:" + m.id + "@coffee-with-ruirui","DTSTAMP:" + new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z",
      "DTSTART;TZID=America/Los_Angeles:" + d + "T" + t(m.start), "DTEND;TZID=America/Los_Angeles:" + d + "T" + t(m.start + m.mins),
      "SUMMARY:Coffee chat with Ruirui",
      "LOCATION:" + (m.mode === "Online" ? "Online (video link from Ruirui)" : "De Anza College or a coffee/boba spot in Cupertino"),
      "DESCRIPTION:Ruirui's phone " + m.phone + " · Instagram @re_wuuuu",
      "END:VEVENT","END:VCALENDAR"].join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
    a.download = "coffee-with-ruirui.ics"; document.body.append(a); a.click(); a.remove();
  }

  function renderBook(){
    const area = $("bookArea"); area.replaceChildren();
    if (brewing){ area.append(brewView()); return; }
    if (justBooked){ area.append(confirmation(justBooked)); return; }
    const dates = [...new Set(windows.map(w => w.date))].sort();
    const openDates = dates.filter(d => LENS.some(n => dayOptions(d, n).length));
    if (!openDates.length){
      if ($("loadStatus").hidden){
        const e = el("div"); e.append(el("h2", null, "No open times right now"), el("p", "note", "Check back soon. New times show up here as soon as I add them."));
        area.append(e);
      }
      return;
    }
    if (!openDates.includes(sel.date)){ sel.date = openDates[0]; sel.start = null; }
    if (!dayOptions(sel.date, sel.len).length){ sel.len = LENS.find(n => dayOptions(sel.date, n).length); sel.start = null; }
    const wrap = el("div"); wrap.style.cssText = "display:flex;flex-direction:column;gap:14px";

    const days = el("div", "days");
    openDates.forEach(d => {
      const b = el("button", "day" + (d === sel.date ? " on" : "")); b.type = "button";
      const dt = dObj(d);
      b.append(el("span", "w", dt.toLocaleDateString("en-US", { weekday: "short" })), el("br"), el("span", "d", String(dt.getDate())));
      b.setAttribute("aria-label", shortDate(d)); b.setAttribute("aria-pressed", d === sel.date);
      b.onclick = () => { sel.date = d; sel.start = null; render(); };
      days.append(b);
    });
    wrap.append(days, el("h2", null, "How long?"));
    const lens = el("div", "pills");
    LENS.forEach(n => {
      const p = el("button", "pill" + (n === sel.len ? " on" : ""), n + " min"); p.type = "button";
      p.disabled = !dayOptions(sel.date, n).length; p.setAttribute("aria-pressed", n === sel.len);
      p.onclick = () => { sel.len = n; sel.start = null; render(); };
      lens.append(p);
    });
    wrap.append(lens, el("h2", null, "Open times"));
    const opts = dayOptions(sel.date, sel.len);
    if (sel.start && !opts.some(o => o.s === sel.start.s && o.w.id === sel.start.wid)) sel.start = null;
    const times = el("div", "times");
    opts.forEach(o => {
      const on = sel.start && sel.start.s === o.s && sel.start.wid === o.w.id;
      const t = el("button", "time" + (on ? " on" : ""), fmtT(o.s)); t.type = "button"; t.setAttribute("aria-pressed", !!on);
      t.onclick = () => { sel.start = { s: o.s, wid: o.w.id }; render(); };
      times.append(t);
    });
    wrap.append(times, el("h2", null, "Where?"));
    const modes = el("div", "pills");
    ["In person", "Online"].forEach(m => {
      const p = el("button", "pill" + (sel.mode === m ? " on" : ""), m); p.type = "button"; p.setAttribute("aria-pressed", sel.mode === m);
      p.onclick = () => { sel.mode = m; render(); };
      modes.append(p);
    });
    wrap.append(modes, el("div", "where", sel.mode === "Online" ? "We'll set up a video call." : "De Anza or a coffee/boba spot in Cupertino"));

    const f = el("form"); f.style.cssText = "display:flex;flex-direction:column;gap:12px";
    const mk = (lab, id, tag, val, max) => { const l = el("label", "f", lab); l.htmlFor = id; const i = el(tag); i.id = id; i.maxLength = max; if (val) i.value = val; l.append(i); return [l, i]; };
    if (!draft) draft = { name: lsGet("cc_name"), contact: lsGet("cc_contact"), topic: "" };
    const [nl, ni] = mk("Your name", "bkName", "input", draft.name, 80);
    const [cl, ci] = mk("How can I reach you? (email, phone or IG)", "bkContact", "input", draft.contact, 120);
    const [tl, ti] = mk("What do you want to chat about? (optional)", "bkTopic", "textarea", draft.topic, 400);
    ni.oninput = () => { draft.name = ni.value; }; ci.oninput = () => { draft.contact = ci.value; }; ti.oninput = () => { draft.topic = ti.value; };
    ni.required = true; ni.autocomplete = "name"; ci.required = true;
    const st = el("div", "status", bookMsg); bookMsg = "";
    const go = el("button", "cta", sel.start ? "Save my seat · " + shortDate(sel.date) + ", " + fmtT(sel.start.s) : "Pick a time first"); go.type = "submit";
    go.disabled = !sel.start;
    f.append(nl, cl, tl, go, st);
    f.addEventListener("submit", ev => { ev.preventDefault(); book(ni.value.trim(), ci.value.trim(), ti.value.trim(), st); });
    wrap.append(f);
    area.append(wrap);
  }

  async function post(body){
    const r = await fetch(API, { method: "POST", body: JSON.stringify(body) });
    return r.json();
  }

  async function book(name, contact, topic, st){
    if (!sel.start) return;
    if (!name || !contact){ st.textContent = "Add your name and a way to reach you."; return; }
    if (!API){ st.textContent = "Booking isn't connected yet."; return; }
    lsSet("cc_name", name); lsSet("cc_contact", contact);
    const req = { action: "book", window: sel.start.wid, start: sel.start.s, mins: sel.len, mode: sel.mode, name, contact, topic };
    const t0 = Date.now();
    brewing = true; render(); try { $("bookCard").scrollIntoView({ behavior: "smooth", block: "start" }); } catch (e) {}
    let res;
    try { res = await post(req); } catch (e) { res = { ok: false, error: "Couldn't reach the booking sheet. Check your connection and try again." }; }
    await wait(Math.max(0, BREW_MS - (Date.now() - t0)));
    brewing = false;
    if (!res || !res.ok){ bookMsg = (res && res.error) || "Couldn't book. Try again."; await load(); render(); return; }
    const m = { id: res.id, token: res.token, phone: res.phone, date: res.date, start: res.start, mins: res.mins, mode: res.mode };
    mine.push(m); saveMine();
    justBooked = m; enterAnim = true; sel.start = null; if (draft) draft.topic = "";
    render(); load();
  }

  async function cancel(m, st){
    try {
      const res = await post({ action: "cancel", id: m.id, token: m.token });
      if (!res.ok && res.error !== "Couldn't find that booking."){ if (st) st.textContent = res.error || "Couldn't cancel. Try again."; return; }
    } catch (e){ if (st) st.textContent = "Couldn't cancel. Check your connection and try again."; return; }
    mine = mine.filter(x => x.id !== m.id); saveMine();
    if (justBooked && justBooked.id === m.id) justBooked = null;
    await load(); render();
  }

  function renderMine(){
    const list = upcomingMine().filter(m => !justBooked || m.id !== justBooked.id);
    $("mineCard").hidden = !list.length;
    const box = $("mineList"); box.replaceChildren();
    list.sort((a, b) => (a.date + hhmm(a.start)).localeCompare(b.date + hhmm(b.start))).forEach(m => {
      const r = el("div", "row"), left = el("div");
      left.append(el("div", null, shortDate(m.date) + ", " + fmtT(m.start) + " – " + fmtT(m.start + m.mins)), el("div", "note", m.mode));
      const acts = el("div"); acts.style.cssText = "display:flex;gap:6px;flex-wrap:wrap";
      const v = el("button", "ghost", "Details"); v.type = "button"; v.onclick = () => { justBooked = m; render(); try { $("bookCard").scrollIntoView({ behavior: "smooth" }); } catch (e) {} };
      const c = el("button", "ghost danger", "Cancel"); c.type = "button"; let armed = false;
      c.onclick = () => { if (!armed){ armed = true; c.textContent = "Tap again"; return; } cancel(m); };
      acts.append(v, c); r.append(left, acts); box.append(r);
    });
  }

  async function load(){
    if (!API){ $("loadStatus").textContent = "Booking opens soon. Message me on Instagram in the meantime!"; return; }
    try {
      const r = await fetch(API + (API.includes("?") ? "&" : "?") + "action=slots&t=" + Date.now());
      const data = await r.json();
      windows = (data.windows || []).map(w => ({ ...w, booked: w.booked || [] }));
      $("loadStatus").hidden = true;
    } catch (e){
      $("loadStatus").hidden = false; $("loadStatus").textContent = "Couldn't load open times. Refresh to try again.";
    }
    const a = document.activeElement;
    const typing = a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA");
    if (!brewing && !typing) render();
  }

  render(); load();
  setInterval(() => { if (!brewing && !document.hidden) load(); }, 60000);
})();
</script>
</body>
</html>
